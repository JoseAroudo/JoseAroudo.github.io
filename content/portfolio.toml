[[proyectos]]
titulo.en    = "Rate ETL from Excel to Oracle"
titulo.es    = "ETL de tarifas de Excel a Oracle"
titulo.pt    = "ETL de tarifas do Excel para Oracle"
anio         = 2026
estado       = "Enel · 2025–26"
tipo.en      = "ETL · Production"
tipo.es      = "ETL · Producción"
tipo.pt      = "ETL · Produção"
resumen.en   = "A process that extracts rates from Excel, transforms and validates them, and loads them into Oracle (INFOREG) for Enel Grids' commercial cycle."
resumen.es   = "Proceso que extrae las tarifas desde Excel, las transforma y valida, y las carga en Oracle (INFOREG) para el ciclo comercial de Enel Grids."
resumen.pt   = "Processo que extrai as tarifas do Excel, as transforma e valida, e as carrega no Oracle (INFOREG) para o ciclo comercial da Enel Grids."
problema.en  = "Loading rates was a manual process of about 30 minutes before the data reached the regulatory database."
problema.es  = "La carga de tarifas era un proceso manual de unos 30 minutos antes de llegar a la base regulatoria."
problema.pt  = "A carga de tarifas era um processo manual de cerca de 30 minutos antes de chegar à base regulatória."
solucion.en  = "ETL in Python with pandas and openpyxl, validations before loading, and an Oracle load with SQL*Loader driven by Batch scripts. Complemented by a subsidies and contributions table modeled in Oracle and loaded with SQL (PIVOT) from billing data."
solucion.es  = "ETL en Python con pandas y openpyxl, validaciones antes del cargue y carga a Oracle con SQL*Loader orquestada por scripts Batch. Se complementa con una tabla de subsidios y contribuciones modelada en Oracle y cargada con SQL (PIVOT) desde la facturación."
solucion.pt  = "ETL em Python com pandas e openpyxl, validações antes da carga e carga no Oracle com SQL*Loader orquestrada por scripts Batch. Complementado por uma tabela de subsídios e contribuições modelada no Oracle e carregada com SQL (PIVOT) a partir do faturamento."
resultado.en = "The process went from 30 to 5 minutes and was documented and handed over to the team."
resultado.es = "El proceso pasó de 30 a 5 minutos y quedó documentado y transferido al equipo."
resultado.pt = "O processo passou de 30 para 5 minutos e ficou documentado e transferido para a equipe."
herramientas = ["Excel · CSV", "Python", "SQL*Loader", "Batch scripts", "Oracle", "pandas", "SQL", "SUI reports"]
metricas     = [
  { valor = "30 → 5", etiqueta = { en = "minutes per load", es = "minutos por carga", pt = "minutos por carga" } },
]
