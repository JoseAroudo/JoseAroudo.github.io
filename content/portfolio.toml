# ─────────────────────────────────────────────────────────────────────────────
#  Única fuente de verdad del sitio. Edita este archivo y corre `python build.py`.
#  El contrato (pipeline/contract.py) valida tipos, fechas y que cada herramienta
#  citada en un proyecto exista en alguna etapa del stack.
#
#  Idiomas: el sitio se publica en inglés (raíz), español (/es/) y portugués (/pt/).
#  Un texto igual en los tres idiomas va como cadena normal; uno traducido va
#  con una clave por idioma:  titulo.en = "…"   titulo.es = "…"   titulo.pt = "…"
#  Si falta una de las tres, el build falla y dice cuál.
# ─────────────────────────────────────────────────────────────────────────────

